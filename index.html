<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꾸로록 챗봇 인터랙션 데모</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
:root{--bg:#EEF1F7;--tx:#44474f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d21;--tx:#b8bbc4}}
:root[data-theme="dark"]{--bg:#1c1d21;--tx:#b8bbc4}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
*{-webkit-tap-highlight-color:transparent;outline:none}
#wrap{position:relative;overflow:hidden;border-radius:8px}
#st{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:#EEF1F7;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
#win{position:absolute;left:180px;top:20px;width:600px;height:500px;background:#fff;border:2px solid #D7DCE6;border-radius:20px;overflow:hidden}
#hd{height:44px;background:#3269D1;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;padding-left:20px}
.yb{position:absolute;right:20px;top:70px;background:#F9E36F;color:#111;border-radius:26px;padding:16px 26px;font-size:17px;font-weight:500;line-height:1.55;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.wb{position:absolute;left:20px;top:168px;width:380px;background:#fff;border:2px solid #D7DCE6;border-radius:26px;padding:22px 26px 14px;opacity:0;transition:opacity .5s}
.ln{font-size:17px;font-weight:500;color:#111;line-height:1.5;margin:0 0 8px;opacity:0;transition:opacity .9s ease}
.src{display:inline-block;margin-top:4px;font-size:14px;font-weight:500;color:#3269D1;background:#E8EFFC;border-radius:14px;padding:5px 12px;opacity:0;transition:opacity .9s ease}
#in{position:absolute;left:20px;right:20px;bottom:14px;height:48px;border-radius:24px;background:#FAFAFA;border:2px solid #CDD2DC}
#tx{position:absolute;left:52px;top:0;height:100%;display:flex;align-items:center;font-size:16px;color:#111;white-space:nowrap}
#tx.ph{color:#AAAAB0}
#cr{display:inline-block;width:2px;height:22px;background:#3269D1;margin-left:3px;visibility:hidden}
#pl{position:absolute;left:16px;top:0;height:100%;display:flex;align-items:center;font-size:28px;color:#111}
#mc{position:absolute;right:62px;top:0;height:100%;display:flex;align-items:center}
#sd{position:absolute;right:6px;top:4px;width:36px;height:36px;border-radius:50%;background:#3269D1;display:flex;align-items:center;justify-content:center}
#hint{position:absolute;left:-3px;top:-3px;width:36px;height:36px;border-radius:50%;border:3px solid #E5484D;opacity:0;pointer-events:none}
#hint.on{animation:pu 1.1s infinite}
@keyframes pu{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.ctl{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:14px}
.ctl button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<div id="st">
<div id="win">
<div id="hd">꾸로록</div>
<div class="yb" id="yb">대학에 가기보다 취업을 선택한 사람들은<br>왜 그런 선택을 했을까?</div>
<div class="wb" id="wb">
<p class="ln">대학과 취업 사이에서 진로를 고민하고 있구나!</p>
<p class="ln">우선 너의 성향을 먼저 파악해볼게.</p>
<p class="ln">지금 가장 끌리는 일은 무엇이야?</p>
<p class="ln">빨리 일을 경험하는 것 vs 더 배우는 것,<br>어느 쪽이 더 끌려?</p>
<span class="src">출처 · 졸업생 인터뷰 보기 ▸</span>
</div>
<div id="in">
<div id="pl">+</div>
<div id="tx" class="ph"><span id="tt">메시지를 입력하세요</span><span id="cr"></span></div>
<div id="mc"><svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"><rect x="7" y="2" width="8" height="14" rx="4"/><path d="M3 12a8 8 0 0 0 16 0M11 20v4"/></svg></div>
<div id="sd"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15V3M3 8.5 9 3l6 5.5"/></svg><div id="hint"></div></div>
</div>
</div>
</div>
</div>
<div class="ctl">
<button id="rs">처음부터 다시</button>
<label><input type="checkbox" id="hn"> 클릭 힌트</label>
</div>
<script>
var Q="대학에 가기보다 취업을 선택한 사람들은 왜 그런 선택을 했을까?";
var st=document.getElementById('st'),wr=document.getElementById('wrap');
function fit(){var s=Math.min(window.innerWidth/960,(window.innerHeight-70)/540);if(s<=0)s=0.3;st.style.transform='scale('+s+')';wr.style.width=(960*s)+'px';wr.style.height=(540*s)+'px'}
fit();window.addEventListener('resize',fit);
var tt=document.getElementById('tt'),tx=document.getElementById('tx'),cr=document.getElementById('cr'),hint=document.getElementById('hint');
var yb=document.getElementById('yb'),wb=document.getElementById('wb'),hn=document.getElementById('hn');
var state=0,timers=[];
function later(f,ms){timers.push(setTimeout(f,ms))}
function setHint(on){hint.className=(on&&hn.checked)?'on':''}
function reset(){
 timers.forEach(clearTimeout);timers=[];state=0;
 tt.textContent='메시지를 입력하세요';tx.className='ph';cr.style.visibility='hidden';
 yb.style.opacity=0;yb.style.transform='translateY(10px)';wb.style.opacity=0;
 wb.querySelectorAll('.ln,.src').forEach(function(e){e.style.opacity=0});
 setHint(false)
}
function typeIt(){
 state=1;tx.className='';tt.textContent='';cr.style.visibility='visible';
 var i=0;
 (function step(){
  if(i<Q.length){i++;tt.textContent=Q.slice(0,i);later(step,70)}
  else{state=2;setHint(true)}
 })()
}
function send(){
 state=3;setHint(false);
 tt.textContent='메시지를 입력하세요';tx.className='ph';cr.style.visibility='hidden';
 yb.style.opacity=1;yb.style.transform='translateY(0)';
 later(function(){state=4},700)
}
function answer(){
 state=5;wb.style.opacity=1;
 var els=wb.querySelectorAll('.ln,.src');
 els.forEach(function(e,i){later(function(){e.style.opacity=1},500+i*800)});
 later(function(){state=6},500+els.length*800)
}
st.addEventListener('click',function(e){
 if(state===0)typeIt();
 else if(state===2){if(document.getElementById('sd').contains(e.target))send()}
 else if(state===4)answer()
});
document.getElementById('rs').addEventListener('click',reset);
hn.addEventListener('change',function(){setHint(state===2)});
</script>
</body>
</html>
